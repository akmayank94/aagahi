[project]
name = "aagahi"
version = "0.0.1"
description = "Aagahi: explainable, leakage-safe air-quality forecasting for Delhi-NCR (data + ML pipeline)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Mayank" }]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.scripts]
aagahi = "aagahi.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aagahi"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
