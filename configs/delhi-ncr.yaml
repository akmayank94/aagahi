# Aagahi city config: Delhi-NCR (D-002, D-025: "a city is a config file").
# Station list = OpenAQ locations within 25 km of central Delhi that were active in the last 24 h
# and run by an agency (DPCC/CPCB/IMD/IITM/UPPCB/HSPCB), measured 17 Nov 2026 (OUTPUTS §2.2, T4a2).
# cpcb_id is filled in build phase B1 from the CPCB station list (hand-checked crosswalk, D-011).
# NOTE: Pusa IMD and Pusa DPCC share coordinates; keep both only if their series differ (D-011).

city: delhi-ncr
display_name: Delhi-NCR
timezone: Asia/Kolkata
centre: {lat: 28.6139, lon: 77.2090}
bbox: {west: 76.8, south: 28.2, east: 77.8, north: 29.2}          # CAMS ADS request area (T5)
fire_region: {west: 73.8, south: 27.6, east: 77.6, north: 32.6}   # Punjab + Haryana (T4b)

forecast:
  targets: [pm25, pm10]           # D-005: concentrations, AQI computed afterwards
  horizon_hours: 72
  quantiles: [0.1, 0.5, 0.9]

weather:
  provider: open-meteo
  model: gfs_seamless             # D-027: pinned, never best_match
  variables: [temperature_2m, wind_speed_10m, relative_humidity_2m, shortwave_radiation]   # D-029 "yes" list
  candidates_to_check_in_b1: [wind_direction_10m, precipitation, surface_pressure, dew_point_2m, temperature_80m, temperature_120m]

cams:
  training_source: copernicus-ads   # D-013: as issued, by lead time
  live_source: open-meteo           # parity-checked vs ADS
  units_from_ads: kg/m3             # T-14: convert with aagahi.units.kg_m3_to_ug_m3

fires:
  provider: nasa-firms
  sensors: [VIIRS_NOAA20, VIIRS_NOAA21, MODIS]   # D-015b: S-NPP excluded

observations:
  live_source: openaq               # D-011: CPCB is India-only
  history_source: cpcb-repository
  delay_minutes:                    # D-028: measured, simulated in training
    openaq_cpcb: 170                # T4a2: 168.9 min for 47/48 stations (17 Nov 2026)

stations:
